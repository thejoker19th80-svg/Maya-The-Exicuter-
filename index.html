<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYA THE EXECUTOR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background-color: #020102; color: #fff; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(5, 2, 4, 0.88); backdrop-filter: blur(10px); padding: 10px;
        }
        .hidden { display: none !important; }

        .title-container { text-align: center; margin-bottom: 20px; }
        h1.title {
            font-size: 2.2rem; color: #ff0033; text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 20px #ff0033, 0 0 40px #880011; font-weight: 900;
        }
        h2.subtitle { font-size: 0.8rem; color: #ffaa00; letter-spacing: 2px; text-transform: uppercase; margin-top: -5px; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 80%; max-width: 300px; }
        .cyber-btn {
            background: linear-gradient(135deg, rgba(255, 0, 51, 0.25), rgba(136, 0, 17, 0.85));
            color: #fff; border: 1px solid #ff0033; padding: 14px 20px; font-size: 0.9rem;
            font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1.5px; box-shadow: 0 0 15px rgba(255, 0, 51, 0.3); text-align: center;
        }
        .cyber-btn:active { transform: scale(0.96); background: #ff0033; }

        .currency-bar {
            position: absolute; top: 12px; right: 15px; z-index: 20; display: flex; gap: 15px;
            font-weight: bold; background: rgba(10, 0, 5, 0.9); padding: 6px 14px; border-radius: 4px;
            border: 1px solid #ff0033; box-shadow: 0 0 10px rgba(255, 0, 51, 0.4); font-size: 0.85rem;
        }

        /* Campaign Mode Direct 3D Action Controls */
        #campaign-controls-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 12;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .action-btns { pointer-events: auto; display: flex; gap: 10px; align-self: flex-end; }
        .ctrl-btn {
            width: 55px; height: 55px; border-radius: 50%; background: rgba(255, 0, 51, 0.6);
            border: 2px solid #ff0033; color: white; font-weight: bold; font-size: 0.75rem;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px #ff0033;
        }

        /* Vertical Combat Mode UI (7x7 Board) */
        #combat-vertical-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 15;
            display: flex; flex-direction: column; background: #050205;
        }
        #combat-3d-arena { width: 100%; height: 42vh; position: relative; }
        #combat-puzzle-board {
            width: 100%; height: 58vh; background: rgba(12, 3, 8, 0.98); border-top: 2px solid #ff0033;
            display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 6px 4px;
        }

        .combat-health-bar {
            position: absolute; top: 10px; width: 42%; height: 16px; background: rgba(255,255,255,0.1);
            border: 1px solid #fff; border-radius: 3px; overflow: hidden;
        }
        .health-fill { height: 100%; width: 100%; transition: width 0.3s ease; }

        /* 7x7 Grid Styling */
        #match3-grid-7x7 {
            display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr);
            gap: 4px; width: 95vw; height: 95vw; max-width: 380px; max-height: 380px;
            background: rgba(25, 5, 12, 0.9); padding: 6px; border: 1.5px solid #ff0033; border-radius: 8px;
        }
        
        .gem {
            width: 100%; height: 100%; border-radius: 6px; display: flex; justify-content: center;
            align-items: center; font-size: 1.1rem; cursor: pointer; transition: transform 0.1s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .gem:active { transform: scale(1.15); }

        /* Neon Gem Colors */
        .gem-red { background: rgba(255, 0, 51, 0.35); border-color: #ff0033; box-shadow: 0 0 6px #ff0033; }
        .gem-blue { background: rgba(0, 153, 255, 0.35); border-color: #0099ff; box-shadow: 0 0 6px #0099ff; }
        .gem-green { background: rgba(0, 255, 102, 0.35); border-color: #00ff66; box-shadow: 0 0 6px #00ff66; }
        .gem-yellow { background: rgba(255, 204, 0, 0.35); border-color: #ffcc00; box-shadow: 0 0 6px #ffcc00; }
        .gem-purple { background: rgba(170, 0, 255, 0.35); border-color: #aa00ff; box-shadow: 0 0 6px #aa00ff; }
        .gem-black { background: rgba(40, 40, 40, 0.8); border-color: #ff0088; box-shadow: 0 0 8px #ff0088; }

        .gem-special { border: 2px solid #fff; animation: pulseGlow 0.8s infinite alternate; }
        @keyframes pulseGlow { from { transform: scale(0.95); } to { transform: scale(1.05); } }

        .episodes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 95%; max-height: 55vh; overflow-y: auto; }
        .ep-card { background: rgba(30, 5, 10, 0.85); border: 1px solid #ff0033; padding: 10px; border-radius: 4px; text-align: center; cursor: pointer; }

        #reaction-overlay {
            position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
            z-index: 30; font-size: 1.1rem; font-weight: 900; color: #ff0055;
            text-shadow: 0 0 15px #ff0055; pointer-events: none; opacity: 0; transition: opacity 0.3s; text-align: center; width: 90%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div class="currency-bar">
            <div>💰 <span id="cash-val">500</span></div>
            <div>⚙️ <span id="parts-val">10</span></div>
        </div>

        <div id="canvas-container"></div>
        <div id="reaction-overlay">😏 EVIL SMILE: EXECUTING HEART BLASTER...</div>

        <!-- Main Menu -->
        <div id="main-menu" class="ui-screen">
            <div class="title-container">
                <h1 class="title">MAYA THE EXECUTOR</h1>
                <h2 class="subtitle">Chapter 1: Origin of the Red Angel</h2>
            </div>
            <div class="btn-group">
                <button class="cyber-btn" onclick="openEpisodes()">Campaign Story (12 Ep)</button>
                <button class="cyber-btn" onclick="openCombatPuzzle()">Combat Quests (6 Side)</button>
                <button class="cyber-btn" onclick="openArmory()">Armory Hub</button>
            </div>
        </div>

        <!-- Episodes Campaign Menu -->
        <div id="episodes-menu" class="ui-screen hidden">
            <h1 class="title" style="font-size:1.6rem;">CAMPAIGN EPISODES</h1>
            <div class="episodes-grid" id="episodes-container"></div>
            <button class="cyber-btn" style="margin-top:12px;" onclick="showScreen('main-menu')">Back</button>
        </div>

        <!-- Armory Screen -->
        <div id="armory-menu" class="ui-screen hidden">
            <h1 class="title" style="font-size:1.6rem;">ARMORY HUB</h1>
            <div style="background:rgba(20,5,10,0.9); padding:15px; border:1px solid #ff0033; display:flex; flex-direction:column; gap:15px; text-align:center;">
                <div>
                    <h3 style="color:#ff0033;">Dual Tactical Pistols</h3>
                    <p>Lvl: <span id="gun-lvl">1</span></p>
                    <button class="cyber-btn" style="margin-top:6px;" onclick="upgradeGun()">Upgrade (200 Cash)</button>
                </div>
                <div style="border-top:1px solid #ff0033; padding-top:10px;">
                    <h3 style="color:#ffaa00;">Dark Phantom Suit</h3>
                    <p>Lvl: <span id="armor-lvl">1</span></p>
                    <button class="cyber-btn" style="margin-top:6px;" onclick="upgradeArmor()">Upgrade (15 Parts)</button>
                </div>
            </div>
            <button class="cyber-btn" style="margin-top:12px;" onclick="showScreen('main-menu')">Back</button>
        </div>

        <!-- Campaign Action Controls Overlay -->
        <div id="campaign-controls-overlay" class="hidden">
            <button class="cyber-btn" style="pointer-events:auto;" onclick="exitCampaignMode()">Exit Episode</button>
            <div class="action-btns">
                <div class="ctrl-btn" onclick="trigger3DAction('fire')">FIRE</div>
                <div class="ctrl-btn" onclick="trigger3DAction('slash')">SLASH</div>
                <div class="ctrl-btn" onclick="trigger3DAction('dodge')">DODGE</div>
            </div>
        </div>

        <!-- Vertical Combat Screen (7x7 Board) -->
        <div id="combat-vertical-screen" class="hidden">
            <div id="combat-3d-arena">
                <div class="combat-health-bar" style="left:15px;">
                    <div id="maya-health" class="health-fill" style="background:#00ffcc;"></div>
                </div>
                <div class="combat-health-bar" style="right:15px;">
                    <div id="enemy-health" class="health-fill" style="background:#ff0033;"></div>
                </div>
            </div>

            <div id="combat-puzzle-board">
                <p id="action-text" style="color:#ffaa00; font-weight:bold; font-size:0.8rem;">MATCH 7x7 NEON GEMS FOR NINJA COMBOS!</p>
                <div id="match3-grid-7x7"></div>
                <button class="cyber-btn" style="padding:8px 20px; margin-top:4px;" onclick="exitCombatPuzzle()">Retreat / Exit</button>
            </div>
        </div>
    </div>

    <script>
        let playerData = { cash: 500, parts: 10, gunLevel: 1, armorLevel: 1 };
        let mayaHP = 100, enemyHP = 100;
        let extraTurn = false;

        const gemTypes = [
            { symbol: '🗡️', class: 'gem-red', type: 'katana' },
            { symbol: '🎯', class: 'gem-blue', type: 'shuriken' },
            { symbol: '🛡️️', class: 'gem-green', type: 'armor' },
            { symbol: '⚡', class: 'gem-yellow', type: 'lightning' },
            { symbol: '🔪', class: 'gem-purple', type: 'dagger' },
            { symbol: '❤️', class: 'gem-black', type: 'heart' }
        ];

        function showScreen(screenId) {
            document.querySelectorAll('.ui-screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('combat-vertical-screen').classList.add('hidden');
            document.getElementById('campaign-controls-overlay').classList.add('hidden');
            if (screenId) document.getElementById(screenId).classList.remove('hidden');
            updateCurrencyUI();
        }

        function updateCurrencyUI() {
            document.getElementById('cash-val').innerText = playerData.cash;
            document.getElementById('parts-val').innerText = playerData.parts;
            document.getElementById('gun-lvl').innerText = playerData.gunLevel;
            document.getElementById('armor-lvl').innerText = playerData.armorLevel;
        }

        /* Campaign Mode (Free Action Controls) */
        function openEpisodes() {
            const container = document.getElementById('episodes-container');
            container.innerHTML = '';
            for(let i=1; i<=12; i++) {
                const card = document.createElement('div');
                card.className = 'ep-card';
                card.innerHTML = `<h4>Ep ${i}</h4><p style="font-size:0.7rem;">Action Mission</p>`;
                card.onclick = () => startCampaignEpisode(i);
                container.appendChild(card);
            }
            showScreen('episodes-menu');
        }

        function startCampaignEpisode(epNum) {
            showScreen(null);
            document.getElementById('campaign-controls-overlay').classList.remove('hidden');
            setupCombat3DArena();
        }

        function trigger3DAction(actionType) {
            alert("Action Triggered: " + actionType.toUpperCase());
        }

        function exitCampaignMode() {
            showScreen('main-menu');
        }

        function openArmory() { showScreen('armory-menu'); }
        function upgradeGun() { if(playerData.cash>=200){ playerData.cash-=200; playerData.gunLevel++; updateCurrencyUI(); } }
        function upgradeArmor() { if(playerData.parts>=15){ playerData.parts-=15; playerData.armorLevel++; updateCurrencyUI(); } }

        /* Vertical 7x7 Combat Logic */
        function openCombatPuzzle() {
            showScreen(null);
            document.getElementById('combat-vertical-screen').classList.remove('hidden');
            mayaHP = 100; enemyHP = 100; updateHealthBars();
            init7x7CombatGrid();
            setupCombat3DArena();
        }

        function exitCombatPuzzle() {
            document.getElementById('combat-vertical-screen').classList.add('hidden');
            showScreen('main-menu');
        }

        function init7x7CombatGrid() {
            const gridEl = document.getElementById('match3-grid-7x7');
            gridEl.innerHTML = '';
            
            // Generate 7x7 (49) Gem Tiles
            for (let r = 0; r < 49; r++) {
                let g = gemTypes[Math.floor(Math.random() * gemTypes.length)];
                const tile = document.createElement('div');
                tile.className = `gem ${g.class}`;
                tile.innerText = g.symbol;
                tile.onclick = () => handleGemClick(g);
                gridEl.appendChild(tile);
            }
        }

        function handleGemClick(gem) {
            let is5MatchSimulated = Math.random() > 0.78; // 5-Gem Match probability
            let dmg = 15;
            let actionMsg = "";

            if (gem.type === 'heart') {
                triggerHeartBlasterMove();
                return;
            }

            if (is5MatchSimulated) {
                extraTurn = true;
                dmg = 32;
                actionMsg = `5-MATCH! EXTRA MOVE + SPECIAL ${gem.type.toUpperCase()} GEM!`;
                showEvilSmileReaction("5-MATCH COMBO! EXTRA TURN!");
            } else {
                if (gem.type === 'katana') { actionMsg = "RED KATANA: Heavy Slice!"; dmg = 22; }
                else if (gem.type === 'shuriken') { actionMsg = "BLUE SHURIKEN: Multi Star Throw!"; dmg = 16; }
                else if (gem.type === 'armor') { actionMsg = "GREEN SHIELD: Defense Guard!"; mayaHP = Math.min(100, mayaHP + 15); dmg = 0; }
                else if (gem.type === 'lightning') { actionMsg = "YELLOW LIGHTNING: Electro Strike!"; dmg = 25; }
                else if (gem.type === 'dagger') { actionMsg = "PURPLE DAGGER: Stealth Stab!"; dmg = 20; }
            }

            enemyHP = Math.max(0, enemyHP - dmg);
            document.getElementById('action-text').innerText = actionMsg;
            updateHealthBars();
            
            if (!extraTurn) {
                setTimeout(enemyTurnAttack, 800);
            } else {
                extraTurn = false;
            }

            checkVictory();
        }

        function triggerHeartBlasterMove() {
            showEvilSmileReaction("😏 EVIL SMILE: DRAINING XP & HEART BLASTER!");
            setTimeout(() => {
                enemyHP = 0;
                updateHealthBars();
                document.getElementById('action-text').innerText = "FATAL 5-PUNCH HEART BLASTER EXECUTION!";
                setTimeout(() => {
                    alert("FATAL VICTORY! Enemy Heart Blasted!");
                    playerData.cash += 250; playerData.parts += 10; updateCurrencyUI();
                    exitCombatPuzzle();
                }, 1000);
            }, 1000);
        }

        function showEvilSmileReaction(msg) {
            const overlay = document.getElementById('reaction-overlay');
            overlay.innerText = msg;
            overlay.style.opacity = 1;
            setTimeout(() => { overlay.style.opacity = 0; }, 2200);
        }

        function enemyTurnAttack() {
            if (enemyHP <= 0) return;
            mayaHP = Math.max(0, mayaHP - 10);
            updateHealthBars();
            if (mayaHP <= 0) { alert("Mission Failed!"); openCombatPuzzle(); }
        }

        function checkVictory() {
            if (enemyHP <= 0) {
                alert("VICTORY! Rewards Added!");
                playerData.cash += 100; playerData.parts += 5; updateCurrencyUI();
                exitCombatPuzzle();
            }
        }

        function updateHealthBars() {
            document.getElementById('maya-health').style.width = mayaHP + '%';
            document.getElementById('enemy-health').style.width = enemyHP + '%';
        }

        /* 3D Scene Engine */
        let scene, camera, renderer, mayaMesh, enemyMesh;
        function init3DWorld() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050204, 0.03);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const redLight = new THREE.PointLight(0xff0033, 4, 20);
            redLight.position.set(0, 5, 2); scene.add(redLight);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x11050a }));
            floor.rotation.x = -Math.PI / 2; scene.add(floor);

            mayaMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.6, 16), new THREE.MeshStandardMaterial({ color: 0xff0033 }));
            mayaMesh.position.set(-1.2, 0.8, 0); scene.add(mayaMesh);

            enemyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.6), new THREE.MeshStandardMaterial({ color: 0x442222 }));
            enemyMesh.position.set(1.2, 0.8, 0); scene.add(enemyMesh);

            animate();
        }

        function setupCombat3DArena() {
            camera.position.set(0, 2.2, 4.5);
            camera.lookAt(0, 0.8, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            mayaMesh.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

        window.onload = () => { init3DWorld(); updateCurrencyUI(); };
    </script>
</body>
    </html>
