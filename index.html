<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYA THE EXECUTOR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background-color: #020102; color: #fff; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(5, 2, 4, 0.85); backdrop-filter: blur(10px); padding: 10px;
        }
        .hidden { display: none !important; }

        .title-container { text-align: center; margin-bottom: 20px; }
        h1.title {
            font-size: 2.5rem; color: #ff0033; text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 0 0 20px #ff0033, 0 0 40px #880011; font-weight: 900;
        }
        h2.subtitle { font-size: 0.85rem; color: #ffaa00; letter-spacing: 2px; text-transform: uppercase; margin-top: -5px; }

        .btn-group { display: flex; gap: 12px; }
        .cyber-btn {
            background: linear-gradient(135deg, rgba(255, 0, 51, 0.2), rgba(136, 0, 17, 0.8));
            color: #fff; border: 1px solid #ff0033; padding: 12px 24px; font-size: 0.85rem;
            font-weight: bold; border-radius: 2px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1.5px; box-shadow: 0 0 15px rgba(255, 0, 51, 0.3);
            transition: all 0.2s ease; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }
        .cyber-btn:active { transform: scale(0.95); background: #ff0033; }

        .currency-bar {
            position: absolute; top: 12px; right: 20px; z-index: 20; display: flex; gap: 15px;
            font-weight: bold; background: rgba(10, 0, 5, 0.9); padding: 6px 16px; border-radius: 4px;
            border: 1px solid #ff0033; box-shadow: 0 0 10px rgba(255, 0, 51, 0.4); font-size: 0.85rem;
        }

        /* Split Screen Combat UI */
        #combat-split-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 15;
            display: flex; flex-direction: column; background: #000;
        }
        #combat-3d-arena { width: 100%; height: 50vh; position: relative; }
        #combat-puzzle-board {
            width: 100%; height: 50vh; background: rgba(15, 3, 6, 0.95); border-top: 2px solid #ff0033;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px;
        }

        .combat-health-bar {
            position: absolute; top: 10px; width: 40%; height: 16px; background: rgba(255,255,255,0.1);
            border: 1px solid #fff; border-radius: 3px; overflow: hidden;
        }
        .health-fill { height: 100%; width: 100%; transition: width 0.3s ease; }

        #match3-grid {
            display: grid; grid-template-columns: repeat(7, 42px); grid-template-rows: repeat(4, 42px);
            gap: 5px; background: rgba(30, 5, 10, 0.8); padding: 8px; border: 1px solid #ff0033; border-radius: 6px;
        }
        .tile {
            width: 42px; height: 42px; border-radius: 4px; display: flex; justify-content: center;
            align-items: center; font-size: 1.2rem; cursor: pointer; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05); transition: transform 0.1s;
        }
        .tile.special { border: 2px solid #ff0033; box-shadow: 0 0 12px #ff0033; animation: glow 1s infinite alternate; }
        .tile.heart { border: 2px solid #ff0088; box-shadow: 0 0 15px #ff0088; animation: heartGlow 0.8s infinite alternate; }

        @keyframes glow { from { box-shadow: 0 0 5px #ff0033; } to { box-shadow: 0 0 15px #ff0033; } }
        @keyframes heartGlow { from { box-shadow: 0 0 5px #ff0088; } to { box-shadow: 0 0 20px #ff0088; } }

        .episodes-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 92%; max-height: 55vh; overflow-y: auto; }
        .ep-card { background: rgba(30, 5, 10, 0.85); border: 1px solid #ff0033; padding: 10px; border-radius: 4px; text-align: center; cursor: pointer; }

        /* Slow Mo & Smile Overlay */
        #reaction-overlay {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            z-index: 30; font-size: 1.5rem; font-weight: 900; color: #ff0055;
            text-shadow: 0 0 20px #ff0055; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div class="currency-bar">
            <div>💰 <span id="cash-val">500</span></div>
            <div>⚙️ <span id="parts-val">10</span></div>
        </div>

        <div id="canvas-container"></div>
        <div id="reaction-overlay">😏 EVIL SMILE: EXECUTING HEART BLASTER...</div>

        <!-- Main Menu -->
        <div id="main-menu" class="ui-screen">
            <div class="title-container">
                <h1 class="title">MAYA THE EXECUTOR</h1>
                <h2 class="subtitle">Chapter 1: Origin of the Red Angel</h2>
            </div>
            <div class="btn-group">
                <button class="cyber-btn" onclick="openEpisodes()">Campaign (12 Ep)</button>
                <button class="cyber-btn" onclick="openCombatPuzzle()">Ninja Combat (6 Side)</button>
                <button class="cyber-btn" onclick="openArmory()">Armory Hub</button>
            </div>
        </div>

        <!-- Episodes Screen -->
        <div id="episodes-menu" class="ui-screen hidden">
            <h1 class="title" style="font-size:1.8rem;">STORY CAMPAIGN</h1>
            <div class="episodes-grid" id="episodes-container"></div>
            <button class="cyber-btn" style="margin-top:12px;" onclick="showScreen('main-menu')">Back</button>
        </div>

        <!-- Armory Screen -->
        <div id="armory-menu" class="ui-screen hidden">
            <h1 class="title" style="font-size:1.8rem;">ARMORY HUB</h1>
            <div style="background:rgba(20,5,10,0.9); padding:15px 30px; border:1px solid #ff0033; display:flex; gap:25px; text-align:center;">
                <div>
                    <h3 style="color:#ff0033;">Dual Tactical Pistols</h3>
                    <p>Level: <span id="gun-lvl">1</span></p>
                    <button class="cyber-btn" style="margin-top:8px;" onclick="upgradeGun()">Upgrade (200 Cash)</button>
                </div>
                <div style="border-left:1px solid #ff0033; padding-left:25px;">
                    <h3 style="color:#ffaa00;">Dark Phantom Suit</h3>
                    <p>Level: <span id="armor-lvl">1</span></p>
                    <button class="cyber-btn" style="margin-top:8px;" onclick="upgradeArmor()">Upgrade (15 Parts)</button>
                </div>
            </div>
            <button class="cyber-btn" style="margin-top:12px;" onclick="showScreen('main-menu')">Back</button>
        </div>

        <!-- Split Screen Combat -->
        <div id="combat-split-screen" class="hidden">
            <div id="combat-3d-arena">
                <div class="combat-health-bar" style="left:20px;">
                    <div id="maya-health" class="health-fill" style="background:#00ffcc;"></div>
                </div>
                <div class="combat-health-bar" style="right:20px;">
                    <div id="enemy-health" class="health-fill" style="background:#ff0033;"></div>
                </div>
            </div>

            <div id="combat-puzzle-board">
                <p id="action-text" style="color:#ffaa00; font-weight:bold; margin-bottom:8px; font-size:0.85rem;">MATCH TILES TO PERFORM WEAPON ATTACKS!</p>
                <div id="match3-grid"></div>
                <button class="cyber-btn" style="margin-top:10px;" onclick="exitCombatPuzzle()">Retreat / Exit</button>
            </div>
        </div>
    </div>

    <script>
        let playerData = { cash: 500, parts: 10, gunLevel: 1, armorLevel: 1 };
        let mayaHP = 100, enemyHP = 100;
        let extraTurn = false;

        const baseTiles = ['🗡️', '🎯', '🔪', '🛡️️'];
        const specialTiles = { '🗡️': '🔥🗡️', '🎯': '⚡🎯', '🔪': '💀🔪' };
        
        function showScreen(screenId) {
            document.querySelectorAll('.ui-screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('combat-split-screen').classList.add('hidden');
            if (screenId) document.getElementById(screenId).classList.remove('hidden');
            updateCurrencyUI();
        }

        function updateCurrencyUI() {
            document.getElementById('cash-val').innerText = playerData.cash;
            document.getElementById('parts-val').innerText = playerData.parts;
            document.getElementById('gun-lvl').innerText = playerData.gunLevel;
            document.getElementById('armor-lvl').innerText = playerData.armorLevel;
        }

        function openEpisodes() {
            const container = document.getElementById('episodes-container');
            container.innerHTML = '';
            for(let i=1; i<=12; i++) {
                const card = document.createElement('div');
                card.className = 'ep-card';
                card.innerHTML = `<h3>Ep ${i}</h3><p>Story Chapter ${i}</p>`;
                card.onclick = () => openCombatPuzzle();
                container.appendChild(card);
            }
            showScreen('episodes-menu');
        }

        function openArmory() { showScreen('armory-menu'); }
        function upgradeGun() { if(playerData.cash>=200){ playerData.cash-=200; playerData.gunLevel++; updateCurrencyUI(); } }
        function upgradeArmor() { if(playerData.parts>=15){ playerData.parts-=15; playerData.armorLevel++; updateCurrencyUI(); } }

        /* Match-3 Combat Logic */
        function openCombatPuzzle() {
            showScreen(null);
            document.getElementById('combat-split-screen').classList.remove('hidden');
            mayaHP = 100; enemyHP = 100; updateHealthBars();
            initCombatGrid();
            setupCombat3DArena();
        }

        function exitCombatPuzzle() {
            document.getElementById('combat-split-screen').classList.add('hidden');
            showScreen('main-menu');
        }

        function initCombatGrid() {
            const gridEl = document.getElementById('match3-grid');
            gridEl.innerHTML = '';
            
            // Generate board with rare Heart Symbol & Special Gems
            for (let r = 0; r < 28; r++) {
                let rand = Math.random();
                let type = baseTiles[Math.floor(rand * baseTiles.length)];
                if (rand > 0.92) type = '❤️'; // Rare Heart Symbol Gem

                const tile = document.createElement('div');
                tile.className = 'tile';
                if (type === '❤️') tile.classList.add('heart');
                tile.innerText = type;
                tile.onclick = () => handleTileClick(type, tile);
                gridEl.appendChild(tile);
            }
        }

        function handleTileClick(type, element) {
            let is5MatchSimulated = Math.random() > 0.75; // Simulating 5-gem match condition
            let dmg = 15;
            let actionMsg = "";

            if (type === '❤️') {
                triggerHeartBlasterMove();
                return;
            }

            if (type.includes('🔥') || type.includes('⚡') || type.includes('💀')) {
                // Special Gem Signature Moves
                triggerSignatureMove(type);
                return;
            }

            if (is5MatchSimulated) {
                // 5-Gem Match Effect
                extraTurn = true;
                dmg = 30;
                actionMsg = "5-GEM MATCH! EXTRA TURN + SPECIAL GEM CREATED!";
                spawnSpecialGem(type);
            } else {
                if (type === '🗡️') { actionMsg = "MAYA: Katana Slice!"; dmg = 20; }
                else if (type === '🎯') { actionMsg = "MAYA: Shuriken Throw!"; dmg = 15; }
                else if (type === '🔪') { actionMsg = "MAYA: Stealth Dagger Hit!"; dmg = 18; }
                else if (type === '🛡️️') { actionMsg = "MAYA: Guard Up!"; mayaHP = Math.min(100, mayaHP + 15); dmg = 0; }
            }

            enemyHP = Math.max(0, enemyHP - dmg);
            document.getElementById('action-text').innerText = actionMsg;
            updateHealthBars();
            
            if (!extraTurn) {
                setTimeout(enemyTurnAttack, 800);
            } else {
                extraTurn = false;
            }

            checkVictory();
        }

        function spawnSpecialGem(baseType) {
            const grid = document.getElementById('match3-grid');
            let specialType = specialTiles[baseType] || '🔥🗡️';
            const specialTile = document.createElement('div');
            specialTile.className = 'tile special';
            specialTile.innerText = specialType;
            specialTile.onclick = () => handleTileClick(specialType, specialTile);
            grid.replaceChild(specialTile, grid.children[Math.floor(Math.random() * 28)]);
        }

        function triggerSignatureMove(specialType) {
            showEvilSmileReaction("MAYA: SIGNATURE WEAPON EXECUTION!");
            enemyHP = Math.max(0, enemyHP - 45);
            updateHealthBars();
            initCombatGrid();
            checkVictory();
        }

        function triggerHeartBlasterMove() {
            // Dual Power: Phase 1 - Consume Opponent XP/Health
            showEvilSmileReaction("EVIL SMILE: DRAIN XP & HEART BLASTER!");
            
            // Slow motion attack sequence
            setTimeout(() => {
                enemyHP = 0;
                updateHealthBars();
                document.getElementById('action-text').innerText = "5-PUNCH HEART BLASTER! OPPONENT HEART BLASTED!";
                setTimeout(() => {
                    alert("SURPRISING FATAL VICTORY! Opponent Bleeding & Blasted!");
                    playerData.cash += 250; playerData.parts += 10; updateCurrencyUI();
                    exitCombatPuzzle();
                }, 1000);
            }, 1200);
        }

        function showEvilSmileReaction(msg) {
            const overlay = document.getElementById('reaction-overlay');
            overlay.innerText = "😏 " + msg;
            overlay.style.opacity = 1;
            setTimeout(() => { overlay.style.opacity = 0; }, 2000);
        }

        function enemyTurnAttack() {
            if (enemyHP <= 0) return;
            mayaHP = Math.max(0, mayaHP - 10);
            updateHealthBars();
            if (mayaHP <= 0) { alert("Mission Failed! Retrying..."); openCombatPuzzle(); }
        }

        function checkVictory() {
            if (enemyHP <= 0) {
                alert("VICTORY! Enemy Defeated. Rewards Added!");
                playerData.cash += 100; playerData.parts += 5; updateCurrencyUI();
                exitCombatPuzzle();
            }
        }

        function updateHealthBars() {
            document.getElementById('maya-health').style.width = mayaHP + '%';
            document.getElementById('enemy-health').style.width = enemyHP + '%';
        }

        /* 3D Scene Rendering */
        let scene, camera, renderer, mayaMesh, enemyMesh;
        function init3DWorld() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050204, 0.03);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const redLight = new THREE.PointLight(0xff0033, 4, 20);
            redLight.position.set(0, 5, 2); scene.add(redLight);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x11050a }));
            floor.rotation.x = -Math.PI / 2; scene.add(floor);

            mayaMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.6, 16), new THREE.MeshStandardMaterial({ color: 0xff0033 }));
            mayaMesh.position.set(-1.5, 0.8, 0); scene.add(mayaMesh);

            enemyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.6), new THREE.MeshStandardMaterial({ color: 0x442222 }));
            enemyMesh.position.set(1.5, 0.8, 0); scene.add(enemyMesh);

            animate();
        }

        function setupCombat3DArena() {
            camera.position.set(0, 2.5, 5);
            camera.lookAt(0, 0.8, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            mayaMesh.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

        window.onload = () => { init3DWorld(); updateCurrencyUI(); };
    </script>
</body>
                    </html>
