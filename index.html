<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYA THE EXECUTOR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background-color: #020102; color: #fff; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
        
        .ui-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(5, 2, 4, 0.92); padding: 10px;
        }
        .hidden { display: none !important; }

        .title-container { text-align: center; margin-bottom: 15px; }
        h1.title {
            font-size: 2.2rem; color: #ff0033; text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 20px #ff0033; font-weight: 900;
        }
        h2.subtitle { font-size: 0.8rem; color: #ffaa00; letter-spacing: 2px; text-transform: uppercase; margin-top: -5px; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 85%; max-width: 320px; }
        .cyber-btn {
            background: linear-gradient(135deg, rgba(255, 0, 51, 0.3), rgba(136, 0, 17, 0.9));
            color: #fff; border: 1.5px solid #ff0033; padding: 14px 18px; font-size: 0.85rem;
            font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1.5px; box-shadow: 0 0 15px rgba(255, 0, 51, 0.4); text-align: center;
            pointer-events: auto;
        }
        .cyber-btn:active { transform: scale(0.95); background: #ff0033; }

        .currency-bar {
            position: absolute; top: 12px; right: 15px; z-index: 110; display: flex; gap: 15px;
            font-weight: bold; background: rgba(10, 0, 5, 0.95); padding: 6px 14px; border-radius: 4px;
            border: 1px solid #ff0033; box-shadow: 0 0 10px rgba(255, 0, 51, 0.4); font-size: 0.85rem;
        }

        .armory-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 95%; max-width: 400px;
            background: rgba(15, 3, 8, 0.9); padding: 12px; border: 1px solid #ff0033; border-radius: 6px;
        }
        .armory-card {
            background: rgba(30, 5, 12, 0.8); border: 1px solid rgba(255, 0, 51, 0.4);
            padding: 8px; border-radius: 4px; text-align: center;
        }
        .armory-card h4 { color: #ff0033; font-size: 0.85rem; margin-bottom: 4px; }
        .armory-card p { font-size: 0.75rem; color: #ffaa00; margin-bottom: 6px; }

        #campaign-controls-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 105;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
        }
        .mission-info-badge {
            background: rgba(10, 0, 5, 0.85); border: 1px solid #ff0033; padding: 6px 12px;
            border-radius: 4px; color: #ffaa00; font-weight: bold; font-size: 0.8rem; pointer-events: auto; align-self: flex-start;
        }
        .action-btns { pointer-events: auto; display: flex; gap: 8px; align-self: flex-end; }
        .ctrl-btn {
            width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 0, 51, 0.8);
            border: 2px solid #ff0033; color: white; font-weight: bold; font-size: 0.7rem;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px #ff0033; cursor: pointer;
        }

        #combat-vertical-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 120;
            display: flex; flex-direction: column; background: #050205;
        }
        #combat-3d-arena { width: 100%; height: 42vh; position: relative; }
        #combat-puzzle-board {
            width: 100%; height: 58vh; background: rgba(12, 3, 8, 0.98); border-top: 2px solid #ff0033;
            display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 6px 4px;
        }

        .combat-health-bar {
            position: absolute; top: 10px; width: 42%; height: 16px; background: rgba(255,255,255,0.1);
            border: 1px solid #fff; border-radius: 3px; overflow: hidden;
        }
        .health-fill { height: 100%; width: 100%; transition: width 0.3s ease; }

        #match3-grid-7x7 {
            display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr);
            gap: 4px; width: 95vw; height: 95vw; max-width: 380px; max-height: 380px;
            background: rgba(25, 5, 12, 0.9); padding: 6px; border: 1.5px solid #ff0033; border-radius: 8px;
        }
        
        .gem {
            width: 100%; height: 100%; border-radius: 6px; display: flex; justify-content: center;
            align-items: center; font-size: 1.1rem; cursor: pointer; transition: transform 0.1s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .gem:active { transform: scale(1.15); }

        .gem-red { background: rgba(255, 0, 51, 0.35); border-color: #ff0033; }
        .gem-blue { background: rgba(0, 153, 255, 0.35); border-color: #0099ff; }
        .gem-green { background: rgba(0, 255, 102, 0.35); border-color: #00ff66; }
        .gem-yellow { background: rgba(255, 204, 0, 0.35); border-color: #ffcc00; }
        .gem-purple { background: rgba(170, 0, 255, 0.35); border-color: #aa00ff; }
        .gem-black { background: rgba(40, 40, 40, 0.8); border-color: #ff0088; }

        .episodes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 95%; max-height: 55vh; overflow-y: auto; }
        .ep-card { background: rgba(30, 5, 10, 0.85); border: 1px solid #ff0033; padding: 8px; border-radius: 4px; text-align: center; cursor: pointer; }

        #reaction-overlay {
            position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
            z-index: 130; font-size: 1.1rem; font-weight: 900; color: #ff0055;
            text-shadow: 0 0 15px #ff0055; pointer-events: none; opacity: 0; transition: opacity 0.3s; text-align: center; width: 90%;
        }
    </style>
    <!-- Three.js CDN Loaded First -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div class="currency-bar">
            <div>💰 <span id="cash-val">500</span></div>
            <div>⚙️ <span id="parts-val">10</span></div>
        </div>

        <div id="canvas-container"></div>
        <div id="reaction-overlay">😏 EVIL SMILE: EXECUTING HEART BLASTER...</div>

        <!-- Main Menu -->
        <div id="main-menu" class="ui-screen">
            <div class="title-container">
                <h1 class="title">MAYA THE EXECUTOR</h1>
                <h2 class="subtitle">Chapter 1: Origin of the Red Angel</h2>
            </div>
            <div class="btn-group">
                <button class="cyber-btn" onclick="openEpisodes()">Campaign Story (12 Ep)</button>
                <button class="cyber-btn" onclick="openCombatPuzzle()">Combat Quests (6 Side)</button>
                <button class="cyber-btn" onclick="openArmory()">Armory Hub</button>
            </div>
        </div>

        <!-- Campaign Menu -->
        <div id="episodes-menu" class="ui-screen hidden">
            <h1 class="title" style="font-size:1.6rem;">CAMPAIGN EPISODES</h1>
            <div class="episodes-grid" id="episodes-container"></div>
            <button class="cyber-btn" style="margin-top:12px;" onclick="showScreen('main-menu')">Back</button>
        </div>

        <!-- Armory Screen -->
        <div id="armory-menu" class="ui-screen hidden">
            <h1 class="title" style="font-size:1.6rem;">ARMORY HUB</h1>
            <div class="armory-grid">
                <div class="armory-card">
                    <h4>Dual Katanas</h4>
                    <p>Lvl: <span id="katana-lvl">1</span></p>
                    <button class="cyber-btn" style="padding:6px 10px;" onclick="upgradeWeapon('katana')">Up (150💰)</button>
                </div>
                <div class="armory-card">
                    <h4>Pistols</h4>
                    <p>Lvl: <span id="pistol-lvl">1</span></p>
                    <button class="cyber-btn" style="padding:6px 10px;" onclick="upgradeWeapon('pistol')">Up (200💰)</button>
                </div>
                <div class="armory-card">
                    <h4>Assault Rifle</h4>
                    <p>Lvl: <span id="ar-lvl">1</span></p>
                    <button class="cyber-btn" style="padding:6px 10px;" onclick="upgradeWeapon('ar')">Up (350💰)</button>
                </div>
                <div class="armory-card">
                    <h4>Sniper Rifle</h4>
                    <p>Lvl: <span id="sniper-lvl">1</span></p>
                    <button class="cyber-btn" style="padding:6px 10px;" onclick="upgradeWeapon('sniper')">Up (10⚙️)</button>
                </div>
            </div>
            <button class="cyber-btn" style="margin-top:12px;" onclick="showScreen('main-menu')">Back</button>
        </div>

        <!-- Campaign Overlay -->
        <div id="campaign-controls-overlay" class="hidden">
            <div style="display:flex; justify-content:space-between; width:100%;">
                <div class="mission-info-badge" id="mission-type-label">MISSION: ASSAULT</div>
                <button class="cyber-btn" style="pointer-events:auto; padding:6px 12px;" onclick="exitCampaignMode()">Exit</button>
            </div>
            <div class="action-btns" id="campaign-btns-container"></div>
        </div>

        <!-- Vertical Combat Screen -->
        <div id="combat-vertical-screen" class="hidden">
            <div id="combat-3d-arena">
                <div class="combat-health-bar" style="left:15px;">
                    <div id="maya-health" class="health-fill" style="background:#00ffcc;"></div>
                </div>
                <div class="combat-health-bar" style="right:15px;">
                    <div id="enemy-health" class="health-fill" style="background:#ff0033;"></div>
                </div>
            </div>

            <div id="combat-puzzle-board">
                <p id="action-text" style="color:#ffaa00; font-weight:bold; font-size:0.8rem;">MATCH 7x7 NEON GEMS FOR NINJA COMBOS!</p>
                <div id="match3-grid-7x7"></div>
                <button class="cyber-btn" style="padding:8px 20px; margin-top:4px;" onclick="exitCombatPuzzle()">Retreat / Exit</button>
            </div>
        </div>
    </div>

    <script>
        let playerData = { cash: 500, parts: 10, katanaLvl: 1, pistolLvl: 1, arLvl: 1, sniperLvl: 1, viktorShieldBroken: false };
        let mayaHP = 100, enemyHP = 100;
        let extraTurn = false;
        let activeMission = null;

        const campaignMissions = [
            { ep: 1, type: "STEALTH", name: "Infiltration", desc: "Dagger & Katana" },
            { ep: 2, type: "STEALTH", name: "Guard Outpost", desc: "Pistol & Katana" },
            { ep: 3, type: "ASSAULT", name: "Docks Rampage", desc: "Assault Rifle" },
            { ep: 4, type: "STEALTH", name: "Cyber Lab", desc: "Ninja Stars & Katana" },
            { ep: 5, type: "ASSAULT", name: "Warehouse Rush", desc: "Assault Rifle" },
            { ep: 6, type: "SNIPER", name: "Tower Vantage", desc: "Sniper Scope Shot" },
            { ep: 7, type: "ASSAULT", name: "Convoy Ambush", desc: "Assault Rifle" },
            { ep: 8, type: "SNIPER", name: "Rooftop Assassination", desc: "Precision Sniper" },
            { ep: 9, type: "STEALTH", name: "Inner Sanctum", desc: "Katana Silent Slash" },
            { ep: 10, type: "SNIPER", name: "Helipad Guard", desc: "Sniper Long Range" },
            { ep: 11, type: "RAID", name: "Citadel Raid: Lord Vane", desc: "Raid Citadel (+500💰, +20⚙️, Shield Keycard)", perkReward: { cash: 500, parts: 20 } },
            { ep: 12, type: "BOSS", name: "Commander Viktor", desc: "Final Boss Fight" }
        ];

        const gemTypes = [
            { symbol: '🗡️️', class: 'gem-red', type: 'katana' },
            { symbol: '🎯', class: 'gem-blue', type: 'shuriken' },
            { symbol: '🛡', class: 'gem-green', type: 'armor' },
            { symbol: '⚡', class: 'gem-yellow', type: 'lightning' },
            { symbol: '🔪', class: 'gem-purple', type: 'dagger' },
            { symbol: '❤️', class: 'gem-black', type: 'heart' }
        ];

        function showScreen(screenId) {
            document.querySelectorAll('.ui-screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('combat-vertical-screen').classList.add('hidden');
            document.getElementById('campaign-controls-overlay').classList.add('hidden');
            if (screenId) document.getElementById(screenId).classList.remove('hidden');
            updateCurrencyUI();
        }

        function updateCurrencyUI() {
            document.getElementById('cash-val').innerText = playerData.cash;
            document.getElementById('parts-val').innerText = playerData.parts;
            document.getElementById('katana-lvl').innerText = playerData.katanaLvl;
            document.getElementById('pistol-lvl').innerText = playerData.pistolLvl;
            document.getElementById('ar-lvl').innerText = playerData.arLvl;
            document.getElementById('sniper-lvl').innerText = playerData.sniperLvl;
        }

        function openEpisodes() {
            const container = document.getElementById('episodes-container');
            container.innerHTML = '';
            campaignMissions.forEach(m => {
                const card = document.createElement('div');
                card.className = 'ep-card';
                card.innerHTML = `<h4>Ep ${m.ep}: ${m.type}</h4><p style="font-size:0.6rem;">${m.desc}</p>`;
                card.onclick = () => startCampaignEpisode(m);
                container.appendChild(card);
            });
            showScreen('episodes-menu');
        }

        function startCampaignEpisode(mission) {
            activeMission = mission;
            showScreen(null);
            document.getElementById('campaign-controls-overlay').classList.remove('hidden');
            document.getElementById('mission-type-label').innerText = `EP ${mission.ep}: ${mission.type} - ${mission.name}`;
            
            const btnBox = document.getElementById('campaign-btns-container');
            btnBox.innerHTML = '';

            if (mission.type === 'SNIPER') {
                btnBox.innerHTML = `<div class="ctrl-btn" onclick="trigger3DAction('ZOOM SCOPE')">SCOPE</div>
                                    <div class="ctrl-btn" onclick="trigger3DAction('HEADSHOT')">SNIPE</div>`;
            } else if (mission.type === 'ASSAULT') {
                btnBox.innerHTML = `<div class="ctrl-btn" onclick="trigger3DAction('AR SPRAY')">SPRAY</div>
                                    <div class="ctrl-btn" onclick="trigger3DAction('GRENADE')">BOMB</div>`;
            } else if (mission.type === 'RAID') {
                btnBox.innerHTML = `<div class="ctrl-btn" onclick="completeRaidMission()">RAID</div>
                                    <div class="ctrl-btn" onclick="trigger3DAction('BREACH')">BREACH</div>`;
            } else {
                btnBox.innerHTML = `<div class="ctrl-btn" onclick="trigger3DAction('KATANA SLASH')">SLASH</div>
                                    <div class="ctrl-btn" onclick="trigger3DAction('STEALTH STAB')">STAB</div>`;
            }

            if (typeof setup3DCharacterModels === "function") {
                setup3DCharacterModels(mission.type);
            }
        }

        function completeRaidMission() {
            if (activeMission && activeMission.perkReward) {
                playerData.cash += activeMission.perkReward.cash;
                playerData.parts += activeMission.perkReward.parts;
                playerData.viktorShieldBroken = true;
                updateCurrencyUI();
                showEvilSmileReaction("RAID COMPLETED! LORD VANE DEFEATED!");
                alert("🎉 CITADEL RAID SUCCESSFUL!\n\nLoot Earned:\n- 💰 +500 Cash\n- ⚙️ +20 Gear Parts\n- 🛡️ Commander Viktor's Shield Keycard Acquired!");
                exitCampaignMode();
            }
        }

        function trigger3DAction(actionType) {
            alert("MAYA EXECUTED: " + actionType);
        }

        function exitCampaignMode() { showScreen('main-menu'); }
        function openArmory() { showScreen('armory-menu'); }

        function upgradeWeapon(type) {
            if (type === 'katana' && playerData.cash >= 150) { playerData.cash -= 150; playerData.katanaLvl++; }
            else if (type === 'pistol' && playerData.cash >= 200) { playerData.cash -= 200; playerData.pistolLvl++; }
            else if (type === 'ar' && playerData.cash >= 350) { playerData.cash -= 350; playerData.arLvl++; }
            else if (type === 'sniper' && playerData.parts >= 10) { playerData.parts -= 10; playerData.sniperLvl++; }
            updateCurrencyUI();
        }

        /* 7x7 Vertical Combat Logic */
        function openCombatPuzzle() {
            showScreen(null);
            document.getElementById('combat-vertical-screen').classList.remove('hidden');
            mayaHP = 100; enemyHP = 100; updateHealthBars();
            init7x7CombatGrid();
            if (typeof setup3DCharacterModels === "function") {
                setup3DCharacterModels("STEALTH");
            }
        }

        function exitCombatPuzzle() {
            document.getElementById('combat-vertical-screen').classList.add('hidden');
            showScreen('main-menu');
        }

        function init7x7CombatGrid() {
            const gridEl = document.getElementById('match3-grid-7x7');
            gridEl.innerHTML = '';
            for (let r = 0; r < 49; r++) {
                let g = gemTypes[Math.floor(Math.random() * gemTypes.length)];
                const tile = document.createElement('div');
                tile.className = `gem ${g.class}`;
                tile.innerText = g.symbol;
                tile.onclick = () => handleGemClick(g);
                gridEl.appendChild(tile);
            }
        }

        function handleGemClick(gem) {
            let is5MatchSimulated = Math.random() > 0.78;
            let dmg = 18;
            let actionMsg = "";

            if (gem.type === 'heart') { triggerHeartBlasterMove(); return; }

            if (is5MatchSimulated) {
                extraTurn = true;
                dmg = 35;
                actionMsg = `5-MATCH! EXTRA MOVE + SPECIAL ${gem.type.toUpperCase()} GEM!`;
                showEvilSmileReaction("5-MATCH COMBO! EXTRA TURN!");
            } else {
                if (gem.type === 'katana') { actionMsg = "RED KATANA: Katana Slice!"; dmg = 22; }
                else if (gem.type === 'shuriken') { actionMsg = "BLUE SHURIKEN: Multi Star Throw!"; dmg = 16; }
                else if (gem.type === 'armor') { actionMsg = "GREEN SHIELD: Defense Shield!"; mayaHP = Math.min(100, mayaHP + 15); dmg = 0; }
                else if (gem.type === 'lightning') { actionMsg = "YELLOW LIGHTNING: Electro Strike!"; dmg = 25; }
                else if (gem.type === 'dagger') { actionMsg = "PURPLE DAGGER: Stealth Dagger Stab!"; dmg = 20; }
            }

            enemyHP = Math.max(0, enemyHP - dmg);
            document.getElementById('action-text').innerText = actionMsg;
            updateHealthBars();
            
            if (!extraTurn) setTimeout(enemyTurnAttack, 800);
            else extraTurn = false;

            checkVictory();
        }

        function trig
